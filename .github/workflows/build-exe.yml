name: Build Windows EXE

on:
  push:
    branches: [exe-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --name image-compressor compress.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: image-compressor-windows
          path: dist/image-compressor.exe
